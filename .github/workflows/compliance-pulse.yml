name: Compliance Pulse Pipeline

on:
  schedule:
    # Curator + Writer: every day at 6 AM UTC
    - cron: '0 6 * * *'
    # Growth teaser: every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser groq requests substack

      - name: Run Curator Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python curator_agent.py

      - name: Run Writer Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          SUBSTACK_USER_ID: ${{ secrets.SUBSTACK_USER_ID }}
          SUBSTACK_URL: ${{ secrets.SUBSTACK_URL }}
        run: python writer_agent.py

      - name: Commit draft (optional)
        run: |
          git config user.name "Compliance Pulse Bot"
          git config user.email "bot@compliancepulse.com"
          git add draft_*.md raw_intel.json
          git commit -m "Daily regulatory draft $(date +%Y-%m-%d)" || echo "No changes"
          git push

  weekly-teaser:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 8 * * 1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Growth Agent
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SUBSTACK_URL: ${{ secrets.SUBSTACK_URL }}
        run: python growth_agent.py